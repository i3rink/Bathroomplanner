<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Annick Bathrooms — Survey Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3248;
    --accent: #4f8ef7; --text: #e8eaf0; --text-dim: #7b82a0;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  header { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; gap: 8px; }
  .logo { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent);
    letter-spacing: 0.05em; white-space: nowrap; }
  .job-info { display: flex; gap: 6px; align-items: center; flex: 1; justify-content: center; }
  .job-info input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 5px 10px; width: 130px; outline: none; }
  .job-info input:focus { border-color: var(--accent); }
  .job-info input::placeholder { color: var(--text-dim); }

  .btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 6px 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #6fa3f9; }
  .btn.warn { border-color: #f7914f55; color: #f7914f; }
  .btn.warn:hover { background: #f7914f22; border-color: #f7914f; }
  .btn.danger { border-color: #f74f4f44; color: #f77; }
  .btn.danger:hover { background: #f74f4f22; border-color: #f74f4f; }

  .workspace { display: flex; flex: 1; overflow: hidden; }

  .sidebar { width: 190px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-section { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); }
  .sidebar-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .tool-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500;
    padding: 8px 4px 6px; cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 4px; transition: all 0.15s; text-align: center; line-height: 1.2; }
  .tool-btn .icon { font-size: 18px; }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn.active { background: rgba(79,142,247,0.15); border-color: var(--accent); color: var(--accent); }

  .dim-display { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 12px; }
  .dim-row { display: flex; justify-content: space-between; color: var(--text-dim); margin-bottom: 2px; }
  .dim-row span:last-child { color: var(--accent); }

  .selected-panel { padding: 10px; border-bottom: 1px solid var(--border); display: none; }
  .selected-panel.visible { display: block; }
  .panel-title { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .size-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .size-row label { font-size: 11px; color: var(--text-dim); width: 14px; }
  .size-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-size: 12px; padding: 4px 6px;
    font-family: 'DM Mono', monospace; outline: none; }
  .size-row input:focus { border-color: var(--accent); }
  .size-row span { font-size: 10px; color: var(--text-dim); }
  .size-hint { font-size: 10px; color: var(--text-dim); margin-top: 2px; font-family: 'DM Mono', monospace; }
  .rotate-btn { width: 100%; margin-top: 6px; font-size: 11px; display: flex; align-items: center;
    justify-content: center; gap: 5px; }

  .canvas-wrap { flex: 1; overflow: auto; background: var(--bg); }
  #mainCanvas { display: block; cursor: crosshair; touch-action: none; }

  .bottom-bar { background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
  .hint { font-size: 11px; color: var(--text-dim); flex: 1; font-family: 'DM Mono', monospace; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; min-width: 280px; max-width: 90vw; }
  .modal h3 { font-size: 15px; margin-bottom: 14px; }
  .modal label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .modal input { width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; padding: 8px 10px;
    font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 12px; }
  .modal input:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo">ANNICK // SURVEY</div>
  <div class="job-info">
    <input type="text" id="jobId" placeholder="Job ID" maxlength="20">
    <input type="text" id="customerName" placeholder="Customer name" maxlength="30">
  </div>
  <div style="display:flex;gap:6px;">
    <button class="btn warn" onclick="redrawRoom()">↺ Redo Room</button>
    <button class="btn danger" onclick="clearAll()">Clear All</button>
    <button class="btn primary" onclick="exportPNG()">💾 Save PNG</button>
  </div>
</header>

<div class="workspace">
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">Mode</div>
      <div class="tool-grid">
        <button class="tool-btn active" id="tool-room" onclick="setMode('room')">
          <span class="icon">⬜</span>Room
        </button>
        <button class="tool-btn" id="tool-select" onclick="setMode('select')">
          <span class="icon">↖</span>Select
        </button>
        <button class="tool-btn" id="tool-erase" onclick="setMode('erase')">
          <span class="icon">🗑</span>Erase
        </button>
        <button class="tool-btn" id="tool-note" onclick="setMode('note')">
          <span class="icon">✏️</span>Note
        </button>
      </div>
    </div>

    <!-- Selected fixture controls — shown when something is selected -->
    <div class="selected-panel" id="selectedPanel">
      <div class="panel-title" id="selectedTitle">Selected</div>
      <div class="size-row">
        <label>W</label>
        <input type="number" id="sizeW" min="1" max="30" step="1" oninput="resizeSelected()">
        <span>cells</span>
      </div>
      <div class="size-row">
        <label>H</label>
        <input type="number" id="sizeH" min="1" max="30" step="1" oninput="resizeSelected()">
        <span>cells</span>
      </div>
      <div class="size-hint" id="sizeHint"></div>
      <button class="btn rotate-btn" onclick="rotateSelected()">↻ Rotate 90°</button>
      <button class="btn danger" style="width:100%;margin-top:6px;font-size:11px;" onclick="deleteSelected()">Delete fixture</button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Sanitaryware</div>
      <div class="tool-grid">
        <button class="tool-btn" onclick="setMode('place','bath')"><span class="icon">🛁</span>Bath</button>
        <button class="tool-btn" onclick="setMode('place','shower')"><span class="icon">🚿</span>Shower</button>
        <button class="tool-btn" onclick="setMode('place','wc')"><span class="icon">🚽</span>WC</button>
        <button class="tool-btn" onclick="setMode('place','basin')"><span class="icon">🚰</span>Basin</button>
        <button class="tool-btn" onclick="setMode('place','furniture')"><span class="icon">🪞</span>Furniture</button>
        <button class="tool-btn" onclick="setMode('place','storage')"><span class="icon">🗄</span>Storage</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Features</div>
      <div class="tool-grid">
        <button class="tool-btn" onclick="setMode('place','window')"><span class="icon">🪟</span>Window</button>
        <button class="tool-btn" onclick="setMode('place','door')"><span class="icon">🚪</span>Door</button>
        <button class="tool-btn" onclick="setMode('place','towelrail')"><span class="icon">♨️</span>Towel Rail</button>
        <button class="tool-btn" onclick="setMode('place','radiator')"><span class="icon">🌡</span>Radiator</button>
        <button class="tool-btn" onclick="setMode('place','pipe')"><span class="icon">⚙️</span>Pipework</button>
        <button class="tool-btn" onclick="setMode('place','drain')"><span class="icon">🔵</span>Drain</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Room size</div>
      <div class="dim-display">
        <div class="dim-row"><span>Width</span><span id="dimW">—</span></div>
        <div class="dim-row"><span>Depth</span><span id="dimH">—</span></div>
        <div class="dim-row"><span>Area</span><span id="dimA">—</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Grid key</div>
      <div class="dim-display" style="font-size:11px;color:var(--text-dim);line-height:1.7;">
        1 cell = 30cm<br>
        Max grid = 9m × 9m<br>
        Click item = select it<br>
        R key = rotate selected
      </div>
    </div>

  </div>

  <div class="canvas-wrap">
    <canvas id="mainCanvas"></canvas>
  </div>
</div>

<div class="bottom-bar">
  <span class="hint" id="hintText">Draw room: click and drag on the grid</span>
  <button class="btn" onclick="undoLast()">↩ Undo</button>
</div>

<div class="modal-overlay" id="noteModal">
  <div class="modal">
    <h3>Add note</h3>
    <label>Text</label>
    <input type="text" id="noteInput" placeholder="e.g. existing soil pipe" maxlength="60">
    <div class="modal-btns">
      <button class="btn" onclick="closeNoteModal()">Cancel</button>
      <button class="btn primary" onclick="confirmNote()">Add</button>
    </div>
  </div>
</div>

<script>
const COLS = 30, ROWS = 30, CELL = 22;
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = COLS * CELL + 1;
canvas.height = ROWS * CELL + 1;

// Default sizes: 1 cell = 30cm
// Rotation swaps w/h — shape drawing handles orientation via item.rotated flag
const FIXTURE_DEFS = {
  bath:      { w:6, h:2, label:'Bath',       color:'#4f8ef7', shape:'bath',
               hint:'Default 1800×600mm. Select then Rotate for end-wall fit.' },
  shower:    { w:3, h:3, label:'Shower',     color:'#a0c4ff', shape:'shower',
               hint:'Default 900×900mm. Resize for 1200×900 etc.' },
  wc:        { w:2, h:2, label:'WC',         color:'#f7c94f', shape:'wc',
               hint:'Default 600×600mm. Rotate to face any wall.' },
  basin:     { w:2, h:2, label:'Basin',      color:'#4ff7c9', shape:'basin',
               hint:'Default 600×600mm. Rotate to mount on any wall.' },
  furniture: { w:4, h:2, label:'Furniture',  color:'#b07fff', shape:'furniture',
               hint:'Vanity unit / fitted furniture. Resize to match.' },
  storage:   { w:3, h:2, label:'Storage',    color:'#8a8a8a', shape:'rect',
               hint:'Freestanding storage. Adjust to match dimensions.' },
  window:    { w:3, h:1, label:'Window',     color:'#a0e0ff', shape:'window',
               hint:'Rotate to place on side walls.' },
  door:      { w:2, h:2, label:'Door',       color:'#f7a04f', shape:'door',
               hint:'Rotate to change which wall and swing direction.' },
  towelrail: { w:3, h:1, label:'Towel Rail', color:'#f74f8e', shape:'rail',
               hint:'Default horizontal. Rotate to place vertically.' },
  radiator:  { w:3, h:1, label:'Radiator',   color:'#f76a4f', shape:'radiator',
               hint:'Default horizontal. Rotate to place vertically.' },
  pipe:      { w:1, h:1, label:'Pipe',       color:'#aaa',    shape:'pipe',
               hint:'One cell = pipe or soil stack location.' },
  drain:     { w:1, h:1, label:'Drain',      color:'#7b82a0', shape:'drain',
               hint:'One cell = floor drain or waste point.' },
};

let mode = 'room', placeType = null;
let room = null, items = [], notes = [];
let isDragging = false, isResizing = false;
let dragStart = null, dragCurrent = null;
let resizeStart = null, resizeItem = null;
let selectedIdx = null, pendingNotePos = null;
let history = [];

// ── HISTORY ──
function saveHistory() {
  history.push({
    room: room ? {...room} : null,
    items: items.map(i => ({...i})),
    notes: notes.map(n => ({...n}))
  });
  if (history.length > 40) history.shift();
}

function undoLast() {
  if (!history.length) return;
  const p = history.pop();
  room = p.room; items = p.items; notes = p.notes;
  selectedIdx = null; isResizing = false; isDragging = false;
  resizeItem = null; resizeStart = null; dragStart = null;
  updateDims(); updateSelectedPanel(); render();
}

// ── SAFE ITEM ACCESS ──
function safeItem() {
  if (selectedIdx === null || selectedIdx < 0 || selectedIdx >= items.length) return null;
  return items[selectedIdx];
}

// ── INPUT ──
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  let cx, cy;
  if (e.touches) { cx = e.touches[0].clientX - r.left; cy = e.touches[0].clientY - r.top; }
  else { cx = e.clientX - r.left; cy = e.clientY - r.top; }
  return { gx: Math.floor(cx / CELL), gy: Math.floor(cy / CELL), px: cx, py: cy };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ── MODE ──
function setMode(m, type) {
  mode = m; placeType = type || null;
  if (m !== 'select') { selectedIdx = null; updateSelectedPanel(); }
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + m);
  if (btn) btn.classList.add('active');
  const hints = {
    room:   'Click and drag to draw the room. "Redo Room" redraws without losing fixtures.',
    select: 'Click a fixture to select it. Drag to move. Rotate or resize in the panel.',
    erase:  'Click any fixture or note to remove it.',
    note:   'Click anywhere on the plan to add a text note.',
    place:  type ? `Placing ${FIXTURE_DEFS[type].label}. Click an empty area to place, or click an existing item to select it instead.` : '',
  };
  document.getElementById('hintText').textContent = hints[m] || '';
  render();
}

function redrawRoom() { saveHistory(); room = null; updateDims(); setMode('room'); }

function clearAll() {
  if (!confirm('Clear everything and start fresh?')) return;
  saveHistory();
  room = null; items = []; notes = []; selectedIdx = null;
  updateDims(); updateSelectedPanel(); render();
}

// ── ROTATE ──
function rotateSelected() {
  const it = safeItem();
  if (!it) return;
  saveHistory();
  // Swap w and h, keep top-left in bounds
  const newW = it.h, newH = it.w;
  it.w = clamp(newW, 1, COLS - it.x);
  it.h = clamp(newH, 1, ROWS - it.y);
  // toggle rotation flag for shape drawing
  it.rotated = !it.rotated;
  updateSelectedPanel();
  render();
}

// keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'r' || e.key === 'R') rotateSelected();
  if (e.key === 'Escape') { selectedIdx = null; updateSelectedPanel(); render(); }
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undoLast(); }
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
});

// ── RESIZE HANDLE ──
function resizeHandlePos(item) {
  return { rx: (item.x + item.w) * CELL - 1, ry: (item.y + item.h) * CELL - 1 };
}
function onResizeHandle(px, py, item) {
  const { rx, ry } = resizeHandlePos(item);
  return Math.abs(px - rx) < 11 && Math.abs(py - ry) < 11;
}

// ── EVENTS ──
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup',   onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); onUp(e); },   {passive:false});

function onDown(e) {
  const {gx, gy, px, py} = getPos(e);

  if (mode === 'room') {
    saveHistory();
    isDragging = true;
    dragStart = {gx: clamp(gx,0,COLS-1), gy: clamp(gy,0,ROWS-1)};
    dragCurrent = {...dragStart};

  } else if (mode === 'place' && placeType) {
    // If clicking on an existing item, select it instead of placing a new one
    const existing = hitTest(gx, gy);
    if (existing >= 0) {
      selectedIdx = existing;
      setMode('select');
      updateSelectedPanel();
      render();
      return;
    }
    saveHistory();
    const d = FIXTURE_DEFS[placeType];
    items.push({
      type: placeType,
      x: clamp(gx, room ? room.x : 0, room ? room.x + room.w - d.w : COLS - d.w),
      y: clamp(gy, room ? room.y : 0, room ? room.y + room.h - d.h : ROWS - d.h),
      w: d.w, h: d.h,
      rotated: false
    });
    render();

  } else if (mode === 'erase') {
    const idx = hitTest(gx, gy);
    if (idx >= 0) { saveHistory(); items.splice(idx, 1); selectedIdx = null; updateSelectedPanel(); render(); return; }
    const ni = noteHitTest(gx, gy);
    if (ni >= 0) { saveHistory(); notes.splice(ni, 1); render(); }

  } else if (mode === 'select') {
    const curSel = safeItem();
    if (curSel && onResizeHandle(px, py, curSel)) {
      saveHistory();
      isResizing = true;
      resizeItem = curSel;
      resizeStart = {gx, gy, origW: curSel.w, origH: curSel.h};
      return;
    }
    const idx = hitTest(gx, gy);
    if (idx >= 0 && idx !== selectedIdx) saveHistory();
    selectedIdx = idx;
    isDragging = idx >= 0;
    dragStart = {gx, gy};
    updateSelectedPanel();
    render();

  } else if (mode === 'note') {
    pendingNotePos = {gx, gy};
    document.getElementById('noteInput').value = '';
    document.getElementById('noteModal').classList.add('open');
    setTimeout(() => document.getElementById('noteInput').focus(), 80);
  }
}

function onMove(e) {
  const {gx, gy, px, py} = getPos(e);

  const sel = safeItem();
  if (mode === 'select' && !isDragging && !isResizing && sel) {
    canvas.style.cursor = onResizeHandle(px, py, sel) ? 'nwse-resize' : 'default';
  }

  if (mode === 'room' && isDragging) {
    dragCurrent = {gx: clamp(gx,0,COLS-1), gy: clamp(gy,0,ROWS-1)};
    render();
  } else if (isResizing && resizeItem && resizeStart) {
    resizeItem.w = clamp(resizeStart.origW + (gx - resizeStart.gx), 1, COLS - resizeItem.x);
    resizeItem.h = clamp(resizeStart.origH + (gy - resizeStart.gy), 1, ROWS - resizeItem.y);
    updateSelectedPanel();
    render();
  } else if (mode === 'select' && isDragging && dragStart) {
    const it = safeItem();
    if (!it) { isDragging = false; return; }
    const dx = gx - dragStart.gx, dy = gy - dragStart.gy;
    if (!dx && !dy) return;
    dragStart = {gx, gy};
    it.x = clamp(it.x + dx, room ? room.x : 0, room ? room.x + room.w - it.w : COLS - it.w);
    it.y = clamp(it.y + dy, room ? room.y : 0, room ? room.y + room.h - it.h : ROWS - it.h);
    render();
  }
}

function onUp(e) {
  if (mode === 'room' && isDragging && dragStart && dragCurrent) {
    const x1 = Math.min(dragStart.gx, dragCurrent.gx);
    const y1 = Math.min(dragStart.gy, dragCurrent.gy);
    const x2 = Math.max(dragStart.gx, dragCurrent.gx);
    const y2 = Math.max(dragStart.gy, dragCurrent.gy);
    if (x2 > x1 && y2 > y1) { room = {x:x1, y:y1, w:x2-x1, h:y2-y1}; updateDims(); }
  }
  isDragging = false; isResizing = false;
  dragStart = null; dragCurrent = null; resizeStart = null; resizeItem = null;
  if (mode === 'select') canvas.style.cursor = 'default';
  render();
}

function hitTest(gx, gy) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (gx >= it.x && gx < it.x + it.w && gy >= it.y && gy < it.y + it.h) return i;
  }
  return -1;
}

function noteHitTest(gx, gy) {
  for (let i = notes.length - 1; i >= 0; i--) {
    if (Math.abs(notes[i].x - gx) <= 1 && Math.abs(notes[i].y - gy) <= 1) return i;
  }
  return -1;
}

// ── SELECTED PANEL ──
function updateSelectedPanel() {
  const panel = document.getElementById('selectedPanel');
  const it = safeItem();
  if (!it) { panel.classList.remove('visible'); return; }
  const def = FIXTURE_DEFS[it.type];
  panel.classList.add('visible');
  document.getElementById('selectedTitle').textContent = def.label;
  document.getElementById('sizeW').value = it.w;
  document.getElementById('sizeH').value = it.h;
  document.getElementById('sizeHint').textContent = `${it.w*300}mm × ${it.h*300}mm`;
  document.getElementById('hintText').textContent = def.hint;
}

function resizeSelected() {
  const it = safeItem(); if (!it) return;
  it.w = clamp(parseInt(document.getElementById('sizeW').value)||1, 1, COLS - it.x);
  it.h = clamp(parseInt(document.getElementById('sizeH').value)||1, 1, ROWS - it.y);
  document.getElementById('sizeHint').textContent = `${it.w*300}mm × ${it.h*300}mm`;
  render();
}

function deleteSelected() {
  const it = safeItem(); if (!it) return;
  saveHistory(); items.splice(selectedIdx, 1);
  selectedIdx = null; updateSelectedPanel(); render();
}

// ── NOTES ──
function closeNoteModal() { document.getElementById('noteModal').classList.remove('open'); }
function confirmNote() {
  const text = document.getElementById('noteInput').value.trim();
  if (text && pendingNotePos) { saveHistory(); notes.push({x: pendingNotePos.gx, y: pendingNotePos.gy, text}); }
  closeNoteModal(); render();
}
document.getElementById('noteInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmNote(); });

// ── DIMENSIONS ──
function updateDims() {
  if (!room) { ['dimW','dimH','dimA'].forEach(id => document.getElementById(id).textContent = '—'); return; }
  document.getElementById('dimW').textContent = (room.w * 0.3).toFixed(2) + 'm';
  document.getElementById('dimH').textContent = (room.h * 0.3).toFixed(2) + 'm';
  document.getElementById('dimA').textContent = (room.w * room.h * 0.09).toFixed(2) + 'm²';
}

// ═══════════════════════════════
// RENDER
// ═══════════════════════════════
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  if (room) drawRoom();
  if (isDragging && dragStart && dragCurrent && mode === 'room') drawDragPreview();
  const validSel = (selectedIdx !== null && selectedIdx >= 0 && selectedIdx < items.length) ? selectedIdx : -1;
  items.forEach((item, i) => drawFixture(item, i === validSel));
  notes.forEach(n => drawNote(n));
}

function drawGrid() {
  // Fine grid lines
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL+0.5, 0); ctx.lineTo(c*CELL+0.5, ROWS*CELL);
    ctx.strokeStyle = c%5===0 ? '#3a4060' : '#242840';
    ctx.lineWidth = c%5===0 ? 1 : 0.5; ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL+0.5); ctx.lineTo(COLS*CELL, r*CELL+0.5);
    ctx.strokeStyle = r%5===0 ? '#3a4060' : '#242840';
    ctx.lineWidth = r%5===0 ? 1 : 0.5; ctx.stroke();
  }
  // Dimension labels — bright so they're actually readable
  ctx.fillStyle = '#7a8ab8';
  ctx.font = '9px DM Mono, monospace';
  ctx.textAlign = 'center';
  for (let c = 5; c <= COLS; c += 5) {
    ctx.fillText((c*0.3).toFixed(1)+'m', c*CELL, 9);
  }
  ctx.textAlign = 'left';
  for (let r = 5; r <= ROWS; r += 5) {
    ctx.fillText((r*0.3).toFixed(1)+'m', 2, r*CELL - 3);
  }
}

function drawRoom() {
  const {x, y, w, h} = room;
  const px=x*CELL, py=y*CELL, pw=w*CELL, ph=h*CELL;
  ctx.fillStyle = 'rgba(79,142,247,0.05)'; ctx.fillRect(px,py,pw,ph);
  ctx.strokeStyle = '#4f8ef7'; ctx.lineWidth = 2.5;
  ctx.strokeRect(px+1, py+1, pw-2, ph-2);
  // White dimension labels on room outline
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText((w*0.3).toFixed(2)+'m', px+pw/2, py-5);
  ctx.save(); ctx.translate(px-7, py+ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText((h*0.3).toFixed(2)+'m', 0, 0); ctx.restore();
}

function drawDragPreview() {
  const x1=Math.min(dragStart.gx,dragCurrent.gx)*CELL, y1=Math.min(dragStart.gy,dragCurrent.gy)*CELL;
  const x2=Math.max(dragStart.gx,dragCurrent.gx)*CELL, y2=Math.max(dragStart.gy,dragCurrent.gy)*CELL;
  const dw=Math.abs(dragCurrent.gx-dragStart.gx), dh=Math.abs(dragCurrent.gy-dragStart.gy);
  ctx.strokeStyle='rgba(79,142,247,0.7)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.strokeRect(x1,y1,x2-x1,y2-y1); ctx.setLineDash([]);
  if (dw>0 && dh>0) {
    ctx.fillStyle='#ffffff'; ctx.font='bold 11px DM Mono, monospace'; ctx.textAlign='center';
    ctx.fillText(`${(dw*0.3).toFixed(2)}m × ${(dh*0.3).toFixed(2)}m`, x1+(x2-x1)/2, y1+(y2-y1)/2);
  }
}

function drawFixture(item, selected) {
  const x=item.x*CELL, y=item.y*CELL, w=item.w*CELL, h=item.h*CELL;
  const def=FIXTURE_DEFS[item.type], col=def.color;
  const cx=x+w/2, cy=y+h/2;
  const rot = item.rotated || false;

  ctx.save();
  ctx.fillStyle=col+'18';
  ctx.strokeStyle=selected?'#ffffff':col;
  ctx.lineWidth=selected?2:1.5;
  ctx.beginPath(); ctx.roundRect(x+2,y+2,w-4,h-4,3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=1.2;

  // All shape drawing is done in the item's own coordinate space.
  // For rotated items we render using the swapped w/h naturally —
  // the shape functions are written to handle both orientations.

  if (def.shape==='bath') {
    // Outer rim
    ctx.beginPath(); ctx.ellipse(cx,cy,w/2-5,h/2-4,0,0,Math.PI*2); ctx.stroke();
    // Inner bowl
    ctx.fillStyle=col+'25';
    ctx.beginPath(); ctx.ellipse(cx,cy,w/2-9,h/2-7,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // Taps (always on narrower end)
    ctx.fillStyle=col;
    if (!rot) {
      ctx.beginPath(); ctx.arc(x+9,cy-5,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+9,cy+5,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+w-10,cy,3,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(cx-5,y+9,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+5,y+9,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx,y+h-10,3,0,Math.PI*2); ctx.stroke();
    }

  } else if (def.shape==='shower') {
    ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx,cy,2,0,Math.PI*2); ctx.fill();
    ctx.setLineDash([3,5]); ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(x+6,y+6); ctx.lineTo(x+w-6,y+h-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-6,y+6); ctx.lineTo(x+6,y+h-6); ctx.stroke();
    ctx.setLineDash([]);

  } else if (def.shape==='wc') {
    // Cistern at top (or left if rotated)
    if (!rot) {
      const cisH=h*0.32;
      ctx.beginPath(); ctx.roundRect(x+4,y+2,w-8,cisH,2); ctx.stroke();
      const bcy=y+cisH+(h-cisH)*0.5;
      ctx.fillStyle=col+'28';
      ctx.beginPath(); ctx.ellipse(cx,bcy,w/2-5,(h-cisH)/2-3,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    } else {
      const cisW=w*0.32;
      ctx.beginPath(); ctx.roundRect(x+2,y+4,cisW,h-8,2); ctx.stroke();
      const bcx=x+cisW+(w-cisW)*0.5;
      ctx.fillStyle=col+'28';
      ctx.beginPath(); ctx.ellipse(bcx,cy,(w-cisW)/2-3,h/2-5,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    }

  } else if (def.shape==='basin') {
    if (!rot) {
      const m=3;
      ctx.beginPath();
      ctx.moveTo(x+m,y+m); ctx.lineTo(x+w-m,y+m);
      ctx.lineTo(x+w-m,y+h*0.38);
      ctx.quadraticCurveTo(x+w-m,y+h-m,cx,y+h-m);
      ctx.quadraticCurveTo(x+m,y+h-m,x+m,y+h*0.38);
      ctx.lineTo(x+m,y+m); ctx.closePath();
      ctx.fillStyle=col+'28'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx,y+m+5,w*0.12,2.5,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx,cy+5,2.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=col+'aa';
      ctx.beginPath(); ctx.arc(cx-8,y+m+3,2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+8,y+m+3,2,0,Math.PI*2); ctx.fill();
    } else {
      // Rotated: back wall on left
      const m=3;
      ctx.beginPath();
      ctx.moveTo(x+m,y+m); ctx.lineTo(x+m,y+h-m);
      ctx.lineTo(x+w*0.38,y+h-m);
      ctx.quadraticCurveTo(x+w-m,y+h-m,x+w-m,cy);
      ctx.quadraticCurveTo(x+w-m,y+m,x+w*0.38,y+m);
      ctx.lineTo(x+m,y+m); ctx.closePath();
      ctx.fillStyle=col+'28'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+m+5,cy,2.5,h*0.12,0,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx+5,cy,2.5,0,Math.PI*2); ctx.fill();
    }

  } else if (def.shape==='furniture') {
    // Vanity unit — rectangular with sink cutout and door lines
    ctx.beginPath(); ctx.rect(x+3,y+3,w-6,h-6); ctx.stroke();
    // Door gap lines
    const doors = Math.max(1, Math.round((w-6)/40));
    const doorW = (w-6)/doors;
    for (let d=1; d<doors; d++) {
      const lx = x+3+d*doorW;
      ctx.beginPath(); ctx.moveTo(lx,y+3); ctx.lineTo(lx,y+h-3); ctx.stroke();
    }
    // Handles
    for (let d=0; d<doors; d++) {
      const hx = x+3+(d+0.5)*doorW;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.roundRect(hx-6,cy-2,12,4,2); ctx.fill();
    }
    // Small sink circle top-right
    ctx.beginPath(); ctx.arc(x+w-14,y+12,5,0,Math.PI*2); ctx.stroke();

  } else if (def.shape==='window') {
    if (!rot) {
      ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x+2,y+2); ctx.lineTo(x+w-2,y+2); ctx.stroke();
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx,y+2); ctx.lineTo(cx,y+h-2); ctx.stroke();
      ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(x+4,y+h-4); ctx.lineTo(x+w-4,y+h-4); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(x+2,y+2); ctx.lineTo(x+2,y+h-2); ctx.stroke();
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+2,cy); ctx.lineTo(x+w-2,cy); ctx.stroke();
      ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(x+w-4,y+4); ctx.lineTo(x+w-4,y+h-4); ctx.stroke();
      ctx.setLineDash([]);
    }

  } else if (def.shape==='door') {
    if (!rot) {
      ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+3,y+3); ctx.lineTo(x+w-3,y+3); ctx.stroke();
      ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(x+3,y+3,w-6,0,Math.PI/2); ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+3,y+3); ctx.lineTo(x+3,y+h-3); ctx.stroke();
      ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(x+3,y+3,h-6,Math.PI/2,Math.PI); ctx.stroke();
      ctx.setLineDash([]);
    }

  } else if (def.shape==='rail') {
    if (!rot) {
      // Horizontal rail
      const bars=Math.max(2,Math.floor((w-8)/8));
      const gap=(w-8)/(bars-1);
      for (let i=0;i<bars;i++) { const bx=x+4+i*gap; ctx.beginPath(); ctx.moveTo(bx,y+3); ctx.lineTo(bx,y+h-3); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(x+4,y+3); ctx.lineTo(x+w-4,y+3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+4,y+h-3); ctx.lineTo(x+w-4,y+h-3); ctx.stroke();
    } else {
      // Vertical rail
      const bars=Math.max(2,Math.floor((h-8)/8));
      const gap=(h-8)/(bars-1);
      for (let i=0;i<bars;i++) { const by=y+4+i*gap; ctx.beginPath(); ctx.moveTo(x+3,by); ctx.lineTo(x+w-3,by); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(x+3,y+4); ctx.lineTo(x+3,y+h-4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+w-3,y+4); ctx.lineTo(x+w-3,y+h-4); ctx.stroke();
    }

  } else if (def.shape==='radiator') {
    if (!rot) {
      const fins=Math.max(2,Math.floor((w-6)/6)); const gap=(w-6)/(fins-1);
      for (let i=0;i<fins;i++) { const fx=x+3+i*gap; ctx.beginPath(); ctx.moveTo(fx,y+3); ctx.lineTo(fx,y+h-3); ctx.stroke(); }
      ctx.beginPath(); ctx.rect(x+3,y+3,w-6,h-6); ctx.stroke();
    } else {
      const fins=Math.max(2,Math.floor((h-6)/6)); const gap=(h-6)/(fins-1);
      for (let i=0;i<fins;i++) { const fy=y+3+i*gap; ctx.beginPath(); ctx.moveTo(x+3,fy); ctx.lineTo(x+w-3,fy); ctx.stroke(); }
      ctx.beginPath(); ctx.rect(x+3,y+3,w-6,h-6); ctx.stroke();
    }

  } else if (def.shape==='pipe') {
    ctx.beginPath(); ctx.arc(cx,cy,CELL/2-3,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2); ctx.fill();

  } else if (def.shape==='drain') {
    ctx.beginPath(); ctx.arc(cx,cy,CELL/2-3,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-5,cy); ctx.lineTo(cx+5,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy-5); ctx.lineTo(cx,cy+5); ctx.stroke();

  } else {
    // Generic rect (storage)
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x+4,y+4); ctx.lineTo(x+w-4,y+h-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-4,y+4); ctx.lineTo(x+4,y+h-4); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Label
  ctx.fillStyle='#e8eaf0';
  ctx.font=`bold ${Math.min(10,Math.max(7,Math.min(w,h)/4))}px DM Sans, sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(def.label, cx, y+h-2);

  // Resize handle (selected only)
  if (selected) {
    const {rx,ry}=resizeHandlePos(item);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#4f8ef7'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(rx-5,ry-5,10,10,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#4f8ef7'; ctx.font='8px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⤡', rx, ry);
  }

  ctx.restore();
}

function drawNote(n) {
  const x=n.x*CELL+2, y=n.y*CELL+CELL/2;
  ctx.font='bold 10px DM Sans, sans-serif';
  const tw=ctx.measureText(n.text).width;
  ctx.fillStyle='rgba(247,201,79,0.18)';
  ctx.beginPath(); ctx.roundRect(x+9,y-8,tw+10,16,3); ctx.fill();
  ctx.fillStyle='#f7c94f'; ctx.beginPath(); ctx.arc(x+3,y,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f7c94f'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(n.text, x+13, y);
}

// ── EXPORT ──
function exportPNG() {
  const jobId=document.getElementById('jobId').value.trim()||'job';
  const name=document.getElementById('customerName').value.trim()||'customer';
  const hh=64;
  const exp=document.createElement('canvas');
  exp.width=canvas.width; exp.height=canvas.height+hh;
  const ec=exp.getContext('2d');
  ec.fillStyle='#1a1d27'; ec.fillRect(0,0,exp.width,hh);
  ec.fillStyle='#4f8ef7'; ec.font='bold 14px sans-serif';
  ec.textAlign='left'; ec.textBaseline='top';
  ec.fillText('ANNICK BATHROOMS — SURVEY DRAWING', 14, 10);
  ec.fillStyle='#7b82a0'; ec.font='12px sans-serif';
  ec.fillText(`Job: ${jobId}   Customer: ${name}   Date: ${new Date().toLocaleDateString('en-GB')}`, 14, 34);
  ec.strokeStyle='#2e3248'; ec.lineWidth=1;
  ec.beginPath(); ec.moveTo(0,hh); ec.lineTo(exp.width,hh); ec.stroke();
  ec.fillStyle='#0f1117'; ec.fillRect(0,hh,canvas.width,canvas.height);
  ec.drawImage(canvas,0,hh);
  const link=document.createElement('a');
  link.download=`survey_${jobId}_${name.replace(/\s+/g,'_')}.png`;
  link.href=exp.toDataURL('image/png');
  link.click();
}

render();
</script>
